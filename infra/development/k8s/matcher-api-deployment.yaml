apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: matcher-api
  template:
    metadata:
      labels:
        app: matcher-api
    spec:
      serviceAccountName: matcher-scaler
      containers:
        - name: matcher-api
          image: ride-sharing/matcher-api
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "4Gi"
              cpu: "2"
          # env:
          #   # Accessing an env variable from the app-config config map
          #   - name: MATCHER_HTTP_ADDR
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MATCHER_MAX_REPLICAS
              value: "4"
            - name: MATCHER_SCALE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matcher-scaling
                  key: token
            - name: MATCHER_ASYNC_ORDERS
              value: "1"
            - name: MATCHER_SCHEDULER_WORKERS
              value: "3"
            - name: MATCHER_DELIVERY_WORKERS
              value: "1"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb
                  key: uri
            - name: MATCHER_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matcher-internal
                  key: token

---
apiVersion: v1
kind: Service
metadata:
  name: matcher-api
spec:
  ports:
    - port: 8082
      targetPort: 8082
  selector:
    app: matcher-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matcher-scaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matcher-scaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["matcher-api"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["matcher-api"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matcher-scaler
subjects:
  - kind: ServiceAccount
    name: matcher-scaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matcher-scaler
